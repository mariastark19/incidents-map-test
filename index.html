<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070914">
    <title>Daily Incidents Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="map-panel" aria-label="Map of incidents">
        <div id="map"></div>
        <div class="map-filters" aria-label="Map filters">
            <div class="municipality-picker">
                <div class="search-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
                        <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input
                        class="search-input"
                        id="municipality-search"
                        type="search"
                        placeholder="Search municipality"
                        autocomplete="off"
                        role="combobox"
                        aria-label="Search municipality"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-controls="municipality-options"
                    >
                    <button
                        class="dropdown-toggle"
                        id="municipalityDropdownToggle"
                        type="button"
                        aria-label="Show municipalities"
                        aria-expanded="false"
                        aria-controls="municipality-options"
                    >▼</button>
                </div>
                <div class="municipality-dropdown" id="municipality-options" role="listbox" hidden></div>
            </div>
            <label class="year-filter" for="year-filter">
                <span class="visually-hidden">Search by year</span>
                <select id="year-filter" aria-label="Search by year">
                    <option value="all">All years</option>
                </select>
            </label>
        </div>
        <div class="map-legend" id="map-legend" aria-label="Incident year colors"></div>
    </main>
</body>
</html>
